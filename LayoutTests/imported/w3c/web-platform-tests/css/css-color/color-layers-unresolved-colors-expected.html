<!doctype html>
<style>
.reference { width: 50px; height: 50px; display: inline-block; color: green; }
.reference > div { width: 100%; height: 100%; background-color: currentcolor; }
</style>
<body>
<script>
    // Each deferred color-layers() of all-opaque unresolved layers resolves to
    // a single opaque layer of the current color.
    for (let i = 0; i < 4; i++) {
        const div = document.createElement("div");
        div.className = "reference";
        const layer = document.createElement("div");
        div.append(layer);
        document.body.append(div);
    }
</script>
</body>
