<!doctype html>
<link rel="help" href="https://drafts.csswg.org/css-color-6/#color-layers">
<link rel="match" href="color-layers-unresolved-colors-ref.html">
<!--
  Regression test: color-layers() whose layers are *all* unresolved colors
  (currentcolor, system colors, color-mix() over unresolved colors) must be
  deferred and resolved at use time, not eagerly resolved. Eagerly calling
  resolvedColor() on an unresolved color used to crash.
-->
<style>
.test { width: 50px; height: 50px; display: inline-block; color: green; }
</style>
<body>
<script>
    function createTest(colors) {
        const div = document.createElement("div");
        div.className = "test";
        div.style.backgroundColor = `color-layers(${colors.join(", ")})`;
        return div;
    }

    // Every layer here is an unresolved color, so the whole function must be
    // deferred until use time. Opaque layers over opaque layers of the same
    // color collapse to that color.
    const cases = [
        ["currentcolor"],
        ["currentcolor", "currentcolor"],
        ["currentcolor", "currentcolor", "currentcolor"],
        ["color-mix(in srgb, currentcolor, currentcolor)", "currentcolor"],
    ];
    for (const colors of cases)
        document.body.append(createTest(colors));
</script>
</body>
